<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hiệu sách của Dread</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>Hiệu sách của Dread</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html">Liên hệ</a>
            <a href="login.html" class="active">Đăng nhập</a>
            <a href="register.html">Đăng ký</a>
            <a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main>
        <h2>Đăng nhập</h2>

        <form action="login.html" method="get" class="form">
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required placeholder="ten@example.com">
            </p>
            <p>
                <label for="password">Mật khẩu</label><br>
                <input type="password" id="password" name="password" required minlength="6">
            </p>
            <p>
                <button type="submit">Đăng nhập</button>
            </p>
        </form>
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </main>

    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 Hiệu sách của Dread. Nơi mỗi trang sách mở ra một thế giới mới.</p>
    </footer>
</body>
</html>
