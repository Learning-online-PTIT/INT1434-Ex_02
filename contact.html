<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Hiệu sách của Dread</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>Hiệu sách của Dread</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a>
            <a href="about.html">Giới thiệu</a>
            <a href="contact.html" class="active">Liên hệ</a>
            <a href="login.html">Đăng nhập</a>
            <a href="register.html">Đăng ký</a>
            <a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main>
        <h2>Liên hệ với chúng tôi</h2>

        <form id="contact-form" action="contact.html" method="get" class="form">
            <p>
                <label for="name">Họ và tên</label><br>
                <input type="text" id="name" name="name" required placeholder="Nguyễn Văn An">
            </p>
            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required placeholder="ten@example.com">
            </p>
            <p>
                <label for="message">Nội dung tin nhắn</label><br>
                <textarea id="message" name="message" rows="5" cols="40"></textarea><br>
                <span id="message-error" class="error"></span>
            </p>
            <p>
                <button type="submit">Gửi tin nhắn</button>
            </p>
        </form>
    </main>

    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 Hiệu sách của Dread. Nơi mỗi trang sách mở ra một thế giới mới.</p>
    </footer>
</body>
</html>
